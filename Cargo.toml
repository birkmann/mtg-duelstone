[workspace]
resolver = "3"
members = ["crates/mtg_protocol", "crates/mtg_client", "crates/arena"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
mtg_protocol = { path = "crates/mtg_protocol" }
mtg_client = { path = "crates/mtg_client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"
tungstenite = "0.29"
ureq = { version = "3", features = ["json"] }
directories = "6"
# browser (wasm32) transport: fetch + WebSocket via web-sys, same versions Bevy already pulls in
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
web-time = "1"
# system_clipboard: without it EditableText pastes from an in-process buffer, not the OS clipboard.
bevy = { version = "0.19", features = ["jpeg", "png", "mesh_picking", "vorbis", "system_clipboard"] }

# Bevy's recommended dev setup: our code lightly optimised, dependencies fully.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
