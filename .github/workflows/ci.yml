name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bevy test binaries with full debuginfo outgrow the runner's disk (and the cache); CI never needs a debugger.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  test:
    # Rust only: the tests use recorded frames and in-process fake servers, not the Java engine.
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # ubuntu-latest leaves ~14 GB free; the native + wasm builds need more. These toolchains go unused here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # the browser client shares the app's code: keep it compiling
      - run: cargo check -p arena --target wasm32-unknown-unknown

  windows:
    # Releases ship a Windows build: keep the platform code (cfg(windows)) compiling.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p arena -p mtg_client --bins
