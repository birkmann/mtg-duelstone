[package]
name = "arena"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mtg-duelstone"
path = "src/main.rs"

[features]
# Fast iteration: cargo run -p arena --features dev
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy.workspace = true
mtg_protocol.workspace = true
mtg_client.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories.workspace = true

# Browser build (`tools/build-web.sh`): URL query → CLI flags, localStorage settings, page origin.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Location", "Storage", "UrlSearchParams", "History"] }
