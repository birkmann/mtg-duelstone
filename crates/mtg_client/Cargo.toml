[package]
name = "mtg_client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mtg_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true

# Native: blocking HTTP/WS on worker threads, engine child process, disk caches.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite.workspace = true
ureq.workspace = true
directories.workspace = true
# fetch-offline: Scryfall bulk files are gzipped JSONL
flate2 = "1"

# Browser: fetch + WebSocket; futures run on the page's event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Location", "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType", "AbortSignal", "console",
] }

[[bin]]
name = "autopilot"
path = "src/bin/autopilot.rs"

[[bin]]
name = "fetch-offline"
path = "src/bin/fetch-offline.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# engine child process: no console window, killed with us (job object); fetch-offline's console
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading",
] }
